name: Generate feeds and deploy

on:
  schedule:
    # Hourly at :22 past (staggered to avoid load concentration)
    - cron: "22 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: state/http_cache.db
          key: http-cache-generate-${{ github.run_id }}
          restore-keys: |
            http-cache-generate-
            http-cache-

      - name: Generate feeds
        run: uv run python -m australianewsrss generate --output-dir _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Report
        if: always()
        run: |
          echo '## Generated Feeds' >> "$GITHUB_STEP_SUMMARY"
          echo '| File | Size |' >> "$GITHUB_STEP_SUMMARY"
          echo '|------|------|' >> "$GITHUB_STEP_SUMMARY"
          for f in _site/feed/*.xml _site/catalogue.json _site/index.html; do
            if [ -f "$f" ]; then
              size=$(wc -c < "$f" | xargs)
              echo "| $(basename "$f") | ${size} bytes |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
