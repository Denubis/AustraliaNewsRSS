name: Discover feeds

on:
  schedule:
    # Daily at 06:07 AEST (20:07 UTC previous day)
    # Offset by 7 minutes to avoid GitHub load concentration
    - cron: "7 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: state/http_cache.db
          key: http-cache-discover-${{ github.run_id }}
          restore-keys: |
            http-cache-discover-
            http-cache-

      - name: Restore feed registry
        uses: actions/cache/restore@v4
        with:
          path: state/feeds.json
          key: feed-registry-
          restore-keys: |
            feed-registry-

      - name: Run discovery
        run: uv run python -m australianewsrss discover

      - name: Save feed registry
        uses: actions/cache/save@v4
        with:
          path: state/feeds.json
          key: feed-registry-${{ github.run_id }}

      - name: Report
        if: always()
        run: |
          echo '## Feed Registry Update' >> "$GITHUB_STEP_SUMMARY"
          if [ -f state/feeds.json ]; then
            count=$(python3 -c "import json; print(len(json.load(open('state/feeds.json'))))")
            echo "Total feeds in registry: ${count}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No registry file produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
